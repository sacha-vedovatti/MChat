services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mchat
      POSTGRES_USER: mchat
      POSTGRES_PASSWORD: mchat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mchat -d mchat"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://mchat:mchat@db:5432/mchat?schema=public
      DATABASE_URL_DOCKER: postgresql://mchat:mchat@db:5432/mchat?schema=public
      JWT_SECRET: change-me-in-production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
