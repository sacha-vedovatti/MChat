name: build

on:
  push:
    paths:
      - 'docker-compose.yml'
      - 'backend/**'
      - 'web/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: docker compose up -d --build

      - name: Verify Backend
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3000/health; then
              exit 0
            fi

            sleep 2
          done

          docker compose logs --no-color backend
          exit 1

      - name: Verify Frontend
        run: |
          html="$(curl --fail --silent --show-error http://localhost:8080)"

          echo "$html" | grep -q '/assets/.*\.js'

          asset_path="$(echo "$html" | grep -oE '/assets/[^" ]+\.js' | head -n1)"
          curl --fail --silent --show-error "http://localhost:8080${asset_path}" >/dev/null

      - name: Verify database
        run: docker compose exec -T db psql -U mchat -d mchat -c "SELECT 1;"

      - name: Shutdown
        if: always()
        run: docker compose down -v
